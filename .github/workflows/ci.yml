name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: @psp/api typecheck needs @psp/shared dist
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # ARCHITECTURE §2 / PAY-001: no card data anywhere, enforced in CI
      - name: PAN-pattern check
        run: pnpm check:pan

      # ARCHITECTURE §2: referenced content keys must exist in the EN catalog
      - name: i18n key check
        run: pnpm check:i18n
